<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>資格スケジュール帳</title>
  <meta name="description" content="IT・簿記・語学・技術系などの資格試験日と申込期間をまとめたスケジュール帳">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <h1>資格スケジュール帳</h1>
        <div class="head-right">
          <label class="pref"><span>受験地</span><select id="pref" aria-label="受験地"></select></label>
          <p class="today"><span id="today"></span><button id="settingsBtn" class="icon-btn" aria-label="設定・同期" title="設定・同期">⚙</button></p>
        </div>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab is-active" data-view="deadline" role="tab">締切が近い</button>
        <button class="tab" data-view="list" role="tab">一覧</button>
        <button class="tab" data-view="calendar" role="tab">カレンダー</button>
        <button class="tab" data-view="plan" role="tab">受験予定<span class="badge" id="planCount"></span></button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="filters" id="filters"></div>

    <section id="view-deadline" class="view is-active"></section>
    <section id="view-list" class="view"></section>
    <section id="view-calendar" class="view"></section>
    <section id="view-plan" class="view"></section>
  </main>

  <dialog id="settings" class="settings">
    <div class="settings-head"><h2>設定</h2><button id="settingsClose" class="icon-btn" aria-label="閉じる">✕</button></div>
    <div id="settingsBody"></div>
  </dialog>

  <footer class="wrap site-footer">
    <p>情報確認日：<span id="checked"></span>。日程は変更される場合があります。申込前に必ず各公式サイトで確認してください。</p>
    <p id="autoInfo"></p>
    <p>☆・メモ・合格済みはこのブラウザに保存されます。⚙ から同期を設定すると、ほかの端末と共有できます。</p>
  </footer>

  <script src="data.js"></script>
  <script src="data_auto.js"></script>
  <script src="app.js"></script>
</body>
</html>
